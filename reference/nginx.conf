server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Der SPA-Fallback. Ohne ihn liefert nginx bei einem direkten Aufruf von
    # /dozent/faecher/f03 einen 404: die Datei gibt es nicht, die Route kennt
    # nur der Router im Browser. try_files reicht deshalb alles Unbekannte an
    # index.html weiter, und der Router uebernimmt dort.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gebaute Assets tragen einen Hash im Namen und aendern sich nie -
    # sie duerfen dauerhaft zwischengespeichert werden.
    location /assets/ {
        # Nur EIN Cache-Control-Header. `expires 1y` wuerde einen zweiten
        # setzen, und zwei widerspruechliche Header sind schwer zu debuggen.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html dagegen NICHT cachen: sie verweist auf die gehashten Dateien.
    # Bliebe sie im Cache, saehen Nutzer nach einem Deployment weiter die alte App.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
